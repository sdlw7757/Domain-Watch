<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>域名到期管理面板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
body{background:#f5f7fa;padding:20px;color:#333;padding-bottom:80px}
.container{max-width:1200px;margin:0 auto}
.header{text-align:center;margin-bottom:30px}
.header h1{color:#2d3748;margin-bottom:10px}
.header p{color:#718096}
.card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:20px;margin-bottom:20px}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:500}
.btn-primary{background:#4263eb;color:white}
.btn-success{background:#00b42a;color:white}
.btn-warning{background:#ff7d00;color:white}
.btn-danger{background:#f53f3f;color:white}
.btn-sm{padding:6px 10px;font-size:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-bottom:20px}
.form-item label{display:block;margin-bottom:6px;font-weight:500;color:#4a5568}
.form-item input,.form-item textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f7fafc;padding:12px;text-align:left;color:#4a5568;font-weight:600}
td{padding:12px;border-bottom:1px solid #f0f0f0}
.warn{background:#fff2f0;color:#f53f3f;font-weight:500}
.ok{color:#00b42a}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;justify-content:center;align-items:center;z-index:999}
.modal-content{background:white;width:90%;max-width:600px;border-radius:16px;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close{font-size:24px;cursor:pointer;color:#999}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px}
.tag-red{background:#ffebee;color:#c53030}
.tag-green{background:#f0fff4;color:#22c55e}
.action-buttons{display:flex;gap:8px;flex-wrap:wrap}
.move-btn{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px}

/* 底部样式 */
.footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#fff;
  padding:12px 20px;
  text-align:center;
  font-size:12px;
  color:#666;
  border-top:1px solid #eee;
  z-index:99;
  line-height:1.5;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🏷️ 域名到期管理面板</h1>
<p>独立设置提醒天数 | 日期自动格式化 | 免费本地化运行</p>
</div>

<div class="card">
<button class="btn btn-primary" onclick="openModal()">➕ 添加域名</button>
<button class="btn btn-success" onclick="exportData()">💾 导出备份</button>
<button class="btn btn-warning" onclick="importData()">📂 导入备份</button>
</div>

<div class="card">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>域名</th>
<th>到期日期</th>
<th>剩余天数</th>
<th>提醒天数</th>
<th>注册地址</th>
<th>注册账号</th>
<th>备注</th>
<th>排序</th>
<th>操作</th>
</tr>
</thead>
<tbody id="domainList"></tbody>
</table>
</div>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<div class="modal-header">
<h2 id="modalTitle">添加域名</h2>
<span class="close" onclick="closeModal()">&times;</span>
</div>
<form id="domainForm">
<input type="hidden" id="editIndex">
<div class="form-grid">
<div class="form-item">
<label>域名</label>
<input type="text" id="domain" required>
</div>
<div class="form-item">
<label>到期日期（任意格式自动转换）</label>
<input type="text" id="expire" placeholder="例如：20280708 / 2027-01-31 / 2027.1.31 / 2027年1月31日" required>
</div>
<div class="form-item">
<label>⚠️ 该域名提醒天数</label>
<input type="number" id="warnDays" placeholder="180" required>
</div>
<div class="form-item">
<label>注册地址</label>
<input type="text" id="regUrl">
</div>
<div class="form-item">
<label>注册账号</label>
<input type="text" id="account">
</div>
<div class="form-item" style="grid-column:1/-1">
<label>备注</label>
<textarea id="note" rows="2"></textarea>
</div>
</div>
<div style="text-align:right;margin-top:20px">
<button type="button" class="btn" onclick="closeModal()">取消</button>
<button type="submit" class="btn btn-primary" style="margin-left:10px">保存</button>
</div>
</form>
</div>
</div>

<!-- 底部声明 -->
<div class="footer">
  <div id="time">北京时间：加载中...</div>
  <div style="margin-top:4px;">本工具仅用于个人域名到期管理 | 数据本地存储，不上传云端</div>
  <div>Copyright © 2026 域名管理面板 保留所有权利</div>
</div>

<script>
const STORAGE_KEY = "domain_data";

function loadData(){
  let data = localStorage.getItem(STORAGE_KEY);
  return data ? JSON.parse(data) : [];
}
function saveData(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

// 日期自动格式化：支持 20280708 / 2028-07-08 / 2028.07.08 等所有格式
function formatDate(dateStr) {
  if (!dateStr) return "";
  let s = dateStr.trim().replace(/\D/g, ""); // 只保留数字

  // 兼容 纯数字8位格式：20280708
  if (s.length === 8) {
    let y = s.slice(0,4);
    let m = s.slice(4,6);
    let d = s.slice(6,8);
    return `${y}-${m}-${d}`;
  }

  // 其他格式处理
  let cleaned = dateStr.replace(/[^0-9]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  let d = new Date(cleaned);
  if (isNaN(d.getTime())) return "";
  let y = d.getFullYear();
  let m = (d.getMonth() + 1).toString().padStart(2, "0");
  let day = d.getDate().toString().padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function getDaysLeft(expireStr){
  let now = new Date();
  let expire = new Date(expireStr);
  now.setHours(0,0,0,0);
  expire.setHours(0,0,0,0);
  let diff = expire - now;
  return Math.floor(diff / (1000*60*6*24));
}

// 向上移动
function moveUp(idx) {
  if (idx <= 0) return;
  let list = loadData();
  [list[idx], list[idx - 1]] = [list[idx - 1], list[idx]];
  saveData(list);
  renderList();
}

// 向下移动
function moveDown(idx) {
  let list = loadData();
  if (idx >= list.length - 1) return;
  [list[idx], list[idx + 1]] = [list[idx + 1], list[idx]];
  saveData(list);
  renderList();
}

function renderList(){
  let list = loadData();
  let html = "";
  list.forEach((item,idx)=>{
    let left = getDaysLeft(item.expire);
    let warn = parseInt(item.warnDays || 180);
    let isWarn = left <= warn;
    let cls = isWarn ? "warn" : "";
    let tag = isWarn ? `<span class="tag tag-red">需提醒</span>` : `<span class="tag tag-green">正常</span>`;

    let moveButtons = `
      <div class="action-buttons">
        <button class="btn btn-sm move-btn ${idx <= 0 ? 'disabled' : ''}" onclick="moveUp(${idx})" ${idx <= 0 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>↑</button>
        <button class="btn btn-sm move-btn ${idx >= list.length-1 ? 'disabled' : ''}" onclick="moveDown(${idx})" ${idx >= list.length-1 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>↓</button>
      </div>
    `;

    html += `<tr class="${cls}">
<td>${item.domain}</td>
<td>${item.expire}</td>
<td>${left}天 ${tag}</td>
<td>${warn}天</td>
<td>${item.regUrl||"-"}</td>
<td>${item.account||"-"}</td>
<td>${item.note||"-"}</td>
<td>${moveButtons}</td>
<td>
<div class="action-buttons">
<button class="btn btn-sm btn-warning" onclick="editItem(${idx})">编辑</button>
<button class="btn btn-sm btn-danger" onclick="deleteItem(${idx})">删除</button>
</div>
</td>
</tr>`;
  });
  document.getElementById("domainList").innerHTML = html || "<tr><td colspan='9' style='text-align:center;padding:20px'>暂无域名，点击添加</td></tr>";
}

function openModal(){
  document.getElementById("modalTitle").textContent = "添加域名";
  document.getElementById("domainForm").reset();
  document.getElementById("editIndex").value = "";
  document.getElementById("warnDays").value = 180;
  document.getElementById("modal").style.display = "flex";
}
function closeModal(){
  document.getElementById("modal").style.display = "none";
}

function editItem(idx){
  let list = loadData();
  let item = list[idx];
  document.getElementById("editIndex").value = idx;
  document.getElementById("domain").value = item.domain;
  document.getElementById("expire").value = item.expire;
  document.getElementById("warnDays").value = item.warnDays || 180;
  document.getElementById("regUrl").value = item.regUrl||"";
  document.getElementById("account").value = item.account||"";
  document.getElementById("note").value = item.note||"";
  document.getElementById("modalTitle").textContent = "编辑域名";
  document.getElementById("modal").style.display = "flex";
}

function deleteItem(idx){
  if(!confirm("确定删除？")) return;
  let list = loadData();
  list.splice(idx,1);
  saveData(list);
  renderList();
}

// 提交时自动格式化日期
document.getElementById("domainForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  let idx = document.getElementById("editIndex").value;
  let rawDate = document.getElementById("expire").value.trim();
  let formattedDate = formatDate(rawDate);
  
  if (!formattedDate) {
    alert("日期格式不正确，请重新输入！");
    return;
  }

  let data = {
    domain: document.getElementById("domain").value,
    expire: formattedDate,
    warnDays: document.getElementById("warnDays").value,
    regUrl: document.getElementById("regUrl").value,
    account: document.getElementById("account").value,
    note: document.getElementById("note").value
  };
  let list = loadData();
  if(idx === "") list.push(data);
  else list[idx] = data;
  saveData(list);
  closeModal();
  renderList();
});

// 导出备份
function exportData(){
  let data = localStorage.getItem(STORAGE_KEY);
  let blob = new Blob([data],{type:"application/json"});
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = "domains.json";
  a.click();
}

// 导入备份
function importData(){
  let input = document.createElement("input");
  input.type="file";
  input.accept=".json";
  input.onchange=e=>{
    let file=e.target.files[0];
    let reader=new FileReader();
    reader.onload=ev=>{
      try{
        let j=JSON.parse(ev.target.result);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(j));
        alert("导入成功！");
        renderList();
      }catch(e){
        alert("文件格式错误");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===================== 底部功能 =====================
// 实时北京时间
function updateTime() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  const timeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
  document.getElementById("time").innerText = `北京时间：${timeStr}`;
}
setInterval(updateTime, 1000);

// 初始化
renderList();
updateTime();
</script>
</body>
</html>
