<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>域名到期管理面板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
/* 禁止全局滚动，只留表格滚动条 */
html, body{
  height: 100%;
  overflow: hidden;
  background:#f5f7fa;
  color:#333;
}

.container{width: 98%;margin:0 auto}

/* 顶部固定 */
.header{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background:#f5f7fa;
  z-index: 999;
  padding: 12px 20px 10px;
  text-align: center;
}
.fixed-buttons{
  position: fixed;
  top: 110px;
  left: 0;
  width: 100%;
  background:#f5f7fa;
  z-index: 999;
  padding: 0 20px 12px;
}

.header h1{color:#2d3748;margin-bottom:6px}
.header p{color:#718096}
.card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:20px;}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:500}
.btn-primary{background:#4263eb;color:white}
.btn-success{background:#00b42a;color:white}
.btn-warning{background:#ff7d00;color:white}
.btn-danger{background:#f53f3f;color:white}
.btn-sm{padding:6px 10px;font:500 14px/1 sans-serif}

/* 搜索条样式 */
.search-bar{
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: 12px;
}
.search-input{
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 14px;
  width: 240px;
  outline: none;
}
.search-input:focus{
  border-color: #4263eb;
}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-bottom:20px}
.form-item label{display:block;margin-bottom:6px;font-weight:500;color:#4a5568}
.form-item input,.form-item textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}

/* 表格容器 —— 唯一滚动条（高度缩小，给统计栏留空间） */
.table-wrap{
  overflow-x:auto;
  overflow-y:auto;
  max-height: calc(100vh - 300px); /* 关键修复：缩小表格高度 */
}

/* 表头固定 */
.table-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #f7fafc;
}

table{width:100%;border-collapse:collapse;table-layout:fixed;}
th{
  background:#f7fafc;
  padding:14px 6px;
  text-align:center;
  color:#4a5568;
  font:700 15px/1.2 sans-serif;
  white-space:nowrap;
  border-bottom:2px solid #e2e8f0;
}
td{
  padding:14px 4px;
  height:52px;
  border-bottom:1px solid #f0f0f0;
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
  overflow:hidden;
  font-size:clamp(12px, 2vw, 15px);
}

/* 列宽固定 */
th:nth-child(2),td:nth-child(2){width:10%}
th:nth-child(3),td:nth-child(3){width:11%}
th:nth-child(4),td:nth-child(4){width:9%}
td:nth-child(5){width:19%;font-size:clamp(9px, 1.6vw, 14px);}
td:nth-child(6){width:12%;font-size:clamp(10px, 1.8vw, 14px);}
td:nth-child(7){width:17%;font-size:clamp(9px, 1.6vw, 14px);}
th:nth-child(8),td:nth-child(8){width:8%}
th:nth-child(9),td:nth-child(9){width:10%}

/* 统计样式 —— 确保一定显示 */
.stats-bar {
  margin-top:12px;
  padding:12px;
  background:#fff;
  border-radius:12px;
  text-align:center;
  font-size:15px;
  font-weight:500;
  color:#4a5568;
  display:block;
}
.stats-bar span {
  color:#4263eb;
  font-weight:600;
}
.stats-bar .permanent {
  color:#00b42a;
}

.warn{background:#fff2f0;color:#f53f3f;font-weight:500}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;justify-content:center;align-items:center;z-index:9999}
.modal-content{background:white;width:90%;max-width:700;border-radius:16px;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close{font-size:24px;cursor:pointer;color:#999}
.tag{display:inline-block;padding:5px 9px;border-radius:6px;font-size:13px;margin-left:4px;white-space:nowrap}
.tag-red{background:#ffebee;color:#c53030}
.tag-green{background:#f0fff4;color:#22c55e}
.tag-permanent{background:#e6f7ef;color:#00b42a;font-weight:500}
.action-buttons{display:flex;gap:6px;justify-content:center;align-items:center}
.move-btn{width:26px;height:26px;padding:0}

.footer{
  position:fixed;bottom:0;left:0;width:100%;
  background:#fff;padding:12px 20px;text-align:center;font-size:12px;color:#666;
  border-top:1px solid #eee;z-index:99;
}
.center{text-align:center}
</style>
</head>
<body>

<div class="header">
  <h1>🏷️ 域名到期管理面板</h1>
  <p>批量添加域名 | 日期自动格式化 | 本地化运行</p>
</div>

<div class="fixed-buttons">
  <div class="card" style="margin-bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="openModal()">➕ 添加域名</button>
    <button class="btn btn-success" onclick="openBatchModal()">📝 批量添加</button>
    <button class="btn btn-warning" onclick="exportData()">💾 导出备份</button>
    <button class="btn btn-danger" onclick="importData()">📂 导入备份</button>
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索域名（模糊匹配）" oninput="doSearch()">
    </div>
  </div>
</div>

<div class="container" style="padding-top:170px; padding-bottom:80px;">
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead class="table-header">
          <tr>
            <th>域名</th>
            <th>到期日期</th>
            <th>剩余天数</th>
            <th>提醒天数</th>
            <th>注册地址</th>
            <th>注册账号</th>
            <th>备注</th>
            <th>排序</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="domainList"></tbody>
      </table>
    </div>

    <!-- 表格下方统计（一定显示） -->
    <div class="stats-bar">
      普通域名：<span id="normalCount">0</span> 个 
      &nbsp;&nbsp;|&nbsp;&nbsp;
      永久域名：<span id="permanentCount" class="permanent">0</span> 个
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal">
<div class="modal-content">
<div class="modal-header">
<h2 id="modalTitle">添加域名</h2>
<span class="close" onclick="closeModal()">&times;</span>
</div>
<form id="domainForm">
<input type="hidden" id="editIndex">
<div class="form-grid">
<div class="form-item"><label>域名</label><input type="text" id="domain" required></div>
<div class="form-item"><label>到期日期（不填=永久）</label><input type="text" id="expire" placeholder="20280708"></div>
<div class="form-item"><label>提醒天数</label><input type="number" id="warnDays" value="180" required></div>
<div class="form-item"><label>注册地址</label><input type="text" id="regUrl"></div>
<div class="form-item"><label>注册账号</label><input type="text" id="account"></div>
<div class="form-item" style="grid-column:1/-1"><label>备注</label><textarea id="note" rows="2"></textarea></div>
</div>
<div style="text-align:right;margin-top:20px">
<button type="button" class="btn" onclick="closeModal()">取消</button>
<button type="submit" class="btn btn-primary" style="margin-left:10px">保存</button>
</div>
</form>
</div>
</div>

<!-- 批量添加 -->
<div class="modal" id="batchModal">
<div class="modal-content">
<div class="modal-header">
<h2>批量添加域名</h2>
<span class="close" onclick="closeBatchModal()">&times;</span>
</div>
<div class="form-grid">
<div class="form-item"><label>公共到期日期</label><input type="text" id="batchExpire"></div>
<div class="form-item"><label>公共提醒天数</label><input type="number" id="batchWarn" value="180"></div>
<div class="form-item"><label>公共注册地址</label><input type="text" id="batchRegUrl"></div>
<div class="form-item"><label>公共注册账号</label><input type="text" id="batchAccount"></div>
<div class="form-item" style="grid-column:1/-1"><label>公共备注</label><textarea id="batchNote" rows="2"></textarea></div>
</div>
<div class="form-item">
<label>一行一个域名</label>
<textarea id="batchDomains" rows="8" style="width:100%;padding:10;border-radius:8px"></textarea>
</div>
<div style="text-align:right;margin-top:16px">
<button class="btn" onclick="closeBatchModal()">取消</button>
<button class="btn btn-primary" onclick="saveBatchEasy()">确认批量添加</button>
</div>
</div>
</div>

<div class="footer">
  <div id="time">北京时间：加载中...</div>
  <div>本工具仅个人管理 | 数据本地存储</div>
</div>

<script>
const STORAGE_KEY = "domain_data";
let allData = loadData();

function loadData(){return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}
function saveData(arr){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));
  allData = [...arr];
}

function formatDate(s){
  if(!s)return"";s=s.replace(/\D/g,"");
  if(s.length===8)return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);
  let d=new Date(s.replace(/[^0-9]/g,"-"));
  if(isNaN(d))return"";
  let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function getDaysLeft(e){
  if(!e)return"永久免费";
  let now=new Date();now.setHours(0,0,0,0);
  let ex=new Date(e);ex.setHours(0,0,0,0);
  return Math.floor((ex-now)/(1000*60*60*24));
}

// 统计更新
function updateStats(){
  let list=allData,n=0,p=0;
  list.forEach(i=>i.expire?n++:p++);
  document.getElementById("normalCount").textContent=n;
  document.getElementById("permanentCount").textContent=p;
}

function moveUp(i){if(i<=0)return;let l=allData;[l[i],l[i-1]]=[l[i-1],l[i]];saveData(l);renderList()}
function moveDown(i){let l=allData;if(i>=l.length-1)return;[l[i],l[i+1]]=[l[i+1],l[i]];saveData(l);renderList()}

// 模糊搜索
function doSearch(){
  let keyword = document.getElementById("searchInput").value.toLowerCase().trim();
  renderList(keyword);
}

// 渲染列表
function renderList(keyword = ""){
  let list = allData.filter(item => {
    if(!keyword) return true;
    return item.domain.toLowerCase().includes(keyword);
  });

  let h="";
  list.forEach((item,i)=>{
    let left=getDaysLeft(item.expire),warn=+item.warnDays||180;
    let isWarn=item.expire&&left<=warn,cls=isWarn?"warn":"";
    let exHtml=item.expire?item.expire:'<span class="tag tag-permanent">永不到期</span>';
    let leftHtml=!item.expire?'<span class="tag tag-permanent">永久免费</span>':
      (isWarn?`${left}天 <span class="tag tag-red">请续订</span>`:`${left}天 <span class="tag-green">正常</span>`);
    let warnHtml=item.expire?`${warn}天`:'<span class="center">-</span>';
    h+=`<tr class="${cls}">
<td>${item.domain}</td>
<td>${exHtml}</td>
<td>${leftHtml}</td>
<td>${warnHtml}</td>
<td>${item.regUrl||"-"}</td>
<td>${item.account||"-"}</td>
<td>${item.note||"-"}</td>
<td>
<button class="btn btn-sm move-btn" onclick="moveUp(${i})" ${i<=0?"disabled":""}>↑</button>
<button class="btn btn-sm move-btn" onclick="moveDown(${i})" ${i>=list.length-1?"disabled":""}>↓</button>
</td>
<td>
<button class="btn btn-sm btn-warning" onclick="editItem(${i})">编辑</button>
<button class="btn btn-sm btn-danger" onclick="deleteItem(${i})">删除</button>
</td>
</tr>`;
  });
  document.getElementById("domainList").innerHTML=h||"<tr><td colspan=9 style='text-align:center;padding:20px'>暂无域名</td></tr>";
  updateStats();
}

function openModal(){document.getElementById("modalTitle").textContent="添加域名";document.getElementById("domainForm").reset();document.getElementById("editIndex").value="";document.getElementById("warnDays").value=180;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function openBatchModal(){document.getElementById("batchModal").style.display="flex"}
function closeBatchModal(){document.getElementById("batchModal").style.display="none"}

function saveBatchEasy(){
  let e=formatDate(document.getElementById("batchExpire").value);
  let w=document.getElementById("batchWarn").value||180;
  let r=document.getElementById("batchRegUrl").value,a=document.getElementById("batchAccount").value,n=document.getElementById("batchNote").value;
  let d=document.getElementById("batchDomains").value.trim().split("\n").map(x=>x.trim()).filter(Boolean);
  if(!d.length){alert("请输入域名");return}
  let list=allData;d.forEach(x=>list.push({domain:x,expire:e,warnDays:w,regUrl:r,account:a,note:n}));
  saveData(list);closeBatchModal();renderList();alert("批量添加成功");
}

function editItem(i){let l=allData,o=l[i];document.getElementById("editIndex").value=i;document.getElementById("domain").value=o.domain;document.getElementById("expire").value=o.expire||"";document.getElementById("warnDays").value=o.warnDays||180;document.getElementById("regUrl").value=o.regUrl||"";document.getElementById("account").value=o.account||"";document.getElementById("note").value=o.note||"";document.getElementById("modalTitle").textContent="编辑域名";document.getElementById("modal").style.display="flex"}
function deleteItem(i){if(!confirm("确定删除？"))return;let l=allData;l.splice(i,1);saveData(l);renderList()}

document.getElementById("domainForm").onsubmit=e=>{
  e.preventDefault();
  let i=document.getElementById("editIndex").value;
  let d=formatDate(document.getElementById("expire").value);
  let o={
    domain:document.getElementById("domain").value,
    expire:d,
    warnDays:document.getElementById("warnDays").value,
    regUrl:document.getElementById("regUrl").value,
    account:document.getElementById("account").value,
    note:document.getElementById("note").value
  };
  let l=allData;i===""?l.push(o):l[i]=o;
  saveData(l);closeModal();renderList();
};

function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(allData)]));a.download="domains.json";a.click()}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=e=>{let f=new FileReader();f.onload=e=>{try{let j=JSON.parse(e.target.result);saveData(j);renderList();alert("导入成功")}catch{alert("文件格式错误")}};f.readAsText(e.target.files[0])};i.click()}

function updateTime(){let t=new Date();document.getElementById("time").innerText=`北京时间：${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}:${String(t.getSeconds()).padStart(2,"0")}`}
setInterval(updateTime,1000);

renderList();
</script>
</body>
</html>
